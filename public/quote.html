<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Your Quote | EHL Junk Out</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: single centered quote ticket; the price is the hero. Same identity as the public site. */
:root{
  --bg:#111419; --panel:#1c212a; --panel2:#252c37; --line:#323b48; --fg:#eef1f4; --muted:#97a3b3;
  --amber:#ffb020; --amber-ink:#1a1204; --good:#4fd18b; --bad:#ff6b6b;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--body);padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}
h1,h2{font-family:var(--display);margin:0;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.logo{display:flex;align-items:center;gap:10px;font:800 19px var(--display);color:var(--fg);text-decoration:none}
.mark{width:28px;height:28px;border-radius:8px;background:repeating-linear-gradient(-45deg,var(--amber) 0 6px,var(--amber-ink) 6px 12px)}
.ticket{background:var(--panel);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.ticket .top{background:var(--amber);color:var(--amber-ink);padding:22px;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.ticket .top::after{content:"";position:absolute;right:-30px;top:0;bottom:0;width:110px;background:repeating-linear-gradient(-45deg,rgba(0,0,0,.12) 0 14px,transparent 14px 28px)}
.ticket .top span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;opacity:.75}
.price{font:800 64px/1 var(--display);letter-spacing:-.03em}
.body{padding:20px 22px;display:flex;flex-direction:column;gap:16px}
.msg{white-space:pre-line}
dl{display:grid;grid-template-columns:96px 1fr;gap:10px 12px;margin:0;font-size:15px}
dt{color:var(--muted);font-size:13px;padding-top:2px}
dd{margin:0;min-width:0;overflow-wrap:anywhere}
.btn{appearance:none;border:none;background:var(--amber);color:var(--amber-ink);font:700 17px var(--body);padding:16px;border-radius:12px;cursor:pointer;width:100%}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.btn:disabled{opacity:.5}
.btns{display:flex;flex-direction:column;gap:10px}
textarea{background:var(--panel2);border:1.5px solid var(--line);color:var(--fg);border-radius:10px;padding:12px;font:16px var(--body);width:100%;resize:vertical}
label{font-size:13px;color:var(--muted);font-weight:600;display:flex;flex-direction:column;gap:6px}
.state{border-radius:14px;padding:16px;font-weight:600;display:flex;flex-direction:column;gap:4px}
.state.yes{background:rgba(79,209,139,.12);color:var(--good)}
.state.no{background:rgba(255,107,107,.1);color:var(--bad)}
.state span{color:var(--fg);font-weight:400}
.note{font-size:13px;color:var(--muted);text-align:center}
.err{color:var(--bad);font-size:14px;min-height:20px;text-align:center}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <a class="logo" href="/"><span class="mark"></span>EHL Junk Out</a>
  <div id="loading" class="note">Loading your quote…</div>
  <div id="missing" hidden class="ticket"><div class="body"><h2>We couldn't find this quote</h2><p style="color:var(--muted)">The link may be incomplete. Check the text we sent you, or reply to it and we'll resend.</p></div></div>
  <div id="quote" hidden>
    <div class="ticket">
      <div class="top"><span>Your quote</span><div class="price mono" id="amt"></div><p id="hi" style="font-weight:600"></p></div>
      <div class="body">
        <p class="msg" id="msg"></p>
        <dl id="details"></dl>
      </div>
    </div>
    <div id="respond" class="btns" style="margin-top:18px">
      <button class="btn" id="accept">Accept quote</button>
      <button class="btn ghost" id="declineOpen">Decline</button>
      <div id="declineBox" hidden style="display:flex;flex-direction:column;gap:10px">
        <label for="why">Want to tell us why? <span style="font-weight:400">(optional)</span><textarea id="why" rows="3" placeholder="Price is higher than I expected"></textarea></label>
        <button class="btn ghost" id="decline">Send decline</button>
      </div>
      <p class="err" id="err"></p>
    </div>
    <div id="result" style="margin-top:18px"></div>
    <p class="note" style="margin-top:18px">Price includes loading, hauling and disposal. You pay after the job is done.</p>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const P=new URLSearchParams(location.search),ID=P.get("id"),K=P.get("k");
const longDate=v=>new Date(v+"T12:00").toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
let Q=null;
function render(){
  $("#loading").hidden=true;$("#quote").hidden=false;
  $("#amt").textContent="$"+Q.quote.amount;
  $("#hi").textContent=Q.firstName?`For ${Q.firstName}`:"";
  $("#msg").textContent=Q.quote.message||"";
  $("#details").innerHTML=`<dt>When</dt><dd>${esc(longDate(Q.date))}<br>${esc(Q.win)} arrival</dd><dt>Where</dt><dd>${esc(Q.town)}</dd><dt>Items</dt><dd>${esc(Q.items.join(", "))}</dd><dt>Load size</dt><dd>${esc(Q.size)}</dd>`;
  const open=Q.status==="quoted";
  $("#respond").hidden=!open;
  const r=Q.response;
  $("#result").innerHTML=Q.status==="accepted"?`<div class="state yes">✓ You accepted this quote<span>We'll see you ${esc(longDate(Q.date))} between ${esc(Q.win)}. We'll text you when we're 30 minutes out.</span></div>`
    :Q.status==="declined"?`<div class="state no">You declined this quote<span>No problem. If you change your mind, reply to our text and we'll work something out.</span></div>`
    :Q.status==="done"?`<div class="state yes">✓ Job complete<span>Thanks for choosing EHL Junk Out!</span></div>`
    :Q.status==="cancelled"?`<div class="state no">This job was cancelled<span>Reply to our text if you'd like to rebook.</span></div>`:"";
}
async function respond(accept){
  const btns=[$("#accept"),$("#decline"),$("#declineOpen")];btns.forEach(b=>b.disabled=true);$("#err").textContent="";
  try{
    const r=await fetch("/api/quote/respond",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({id:ID,k:K,accept,note:accept?"":$("#why").value.trim()})});
    const j=await r.json();if(!r.ok)throw new Error(j.error);Q=j;render();
  }catch(e){$("#err").textContent=e.message||"That didn't go through. Try again in a moment."}
  btns.forEach(b=>b.disabled=false);
}
$("#accept").onclick=()=>respond(true);
$("#declineOpen").onclick=()=>{$("#declineBox").hidden=false;$("#declineOpen").hidden=true;$("#why").focus()};
$("#decline").onclick=()=>respond(false);
(async()=>{
  try{
    if(!ID||!K)throw 0;
    const r=await fetch("/api/quote?id="+encodeURIComponent(ID)+"&k="+encodeURIComponent(K));
    if(!r.ok)throw 0;Q=await r.json();if(!Q.quote)throw 0;render();
  }catch(e){$("#loading").hidden=true;$("#missing").hidden=false}
})();
</script>
</body>
</html>
